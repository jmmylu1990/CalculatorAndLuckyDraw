<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amway Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="nav-header">
        <a th:href="@{/lottery}" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            切換至抽獎轉盤
        </a>
    </div>
    <div class="app-container">
        <!-- Calculator Card -->
        <div class="calculator-card">
            <!-- Alert Toast for errors like Division by Zero -->
            <div id="alert-toast" class="alert-toast">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-message">錯誤訊息</span>
            </div>

            <!-- Display Screen -->
            <div class="screen">
                <div id="expression-display" class="expression-display" th:text="${history != null and !history.isEmpty()} ? ${history.get(history.size() - 1)} : ''"></div>
                <div id="value-display" class="value-display" th:text="${currentValue}">0</div>
            </div>

            <!-- Keypad Grid -->
            <div class="keypad">
                <!-- Row 1: Actions -->
                <button id="btn-clear" class="btn btn-action btn-clear">清除</button>
                <button id="btn-undo" class="btn btn-action" th:disabled="${!undoAvailable}" title="復原 (Ctrl+Z)">復原</button>
                <button id="btn-redo" class="btn btn-action" th:disabled="${!redoAvailable}" title="取消復原 (Ctrl+Y)">取消復原</button>
                <button id="btn-backspace" class="btn btn-action" title="退格 (Backspace)">退格</button>

                <!-- Row 2: 7, 8, 9, / -->
                <button class="btn btn-num" onclick="appendDigit('7')">7</button>
                <button class="btn btn-num" onclick="appendDigit('8')">8</button>
                <button class="btn btn-num" onclick="appendDigit('9')">9</button>
                <button id="btn-div" class="btn btn-op" onclick="handleOperator('/')">/</button>

                <!-- Row 3: 4, 5, 6, * -->
                <button class="btn btn-num" onclick="appendDigit('4')">4</button>
                <button class="btn btn-num" onclick="appendDigit('5')">5</button>
                <button class="btn btn-num" onclick="appendDigit('6')">6</button>
                <button id="btn-mul" class="btn btn-op" onclick="handleOperator('*')">*</button>

                <!-- Row 4: 1, 2, 3, - -->
                <button class="btn btn-num" onclick="appendDigit('1')">1</button>
                <button class="btn btn-num" onclick="appendDigit('2')">2</button>
                <button class="btn btn-num" onclick="appendDigit('3')">3</button>
                <button id="btn-sub" class="btn btn-op" onclick="handleOperator('-')">-</button>

                <!-- Row 5: 0, ., = , + -->
                <button class="btn btn-num" onclick="appendDigit('0')">0</button>
                <button class="btn btn-num" onclick="appendDigit('.')">.</button>
                <button id="btn-add" class="btn btn-op" onclick="handleOperator('+')">+</button>
                <button class="btn btn-eq" onclick="handleEquals()">=</button>
            </div>
        </div>

        <!-- History Card -->
        <div class="history-card">
            <div class="history-header">
                <h3>計算歷史</h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <ul id="history-list" class="history-list">
                <li class="history-item" th:each="item : ${history}" th:text="${item}"></li>
            </ul>
        </div>
    </div>

    <!-- UI Logic and AJAX handling -->
    <script>
        let currentInput = "";
        let pendingOperator = null;
        let backendValue = document.getElementById("value-display").innerText;
        let isNewCalculationStart = true;

        // On load, auto scroll history to bottom
        window.addEventListener('DOMContentLoaded', () => {
            const list = document.getElementById("history-list");
            list.scrollTop = list.scrollHeight;
        });

        function appendDigit(digit) {
            if (isNewCalculationStart) {
                if (digit === '.') {
                    currentInput = "0.";
                } else {
                    currentInput = digit;
                }
                isNewCalculationStart = false;
            } else {
                if (digit === '.' && currentInput.includes('.')) return;
                if (currentInput === "0" && digit !== '.') {
                    currentInput = digit;
                } else {
                    currentInput += digit;
                }
            }
            refreshDisplay();
        }

        function refreshDisplay() {
            if (currentInput) {
                document.getElementById("value-display").innerText = currentInput;
            } else {
                document.getElementById("value-display").innerText = backendValue;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("alert-toast");
            document.getElementById("alert-message").innerText = msg;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        function updateOperatorHighlight() {
            document.querySelectorAll(".btn-op").forEach(btn => btn.classList.remove("active"));
            
            if (pendingOperator) {
                let btnId = "";
                if (pendingOperator === '+') btnId = "btn-add";
                else if (pendingOperator === '-') btnId = "btn-sub";
                else if (pendingOperator === '*') btnId = "btn-mul";
                else if (pendingOperator === '/') btnId = "btn-div";
                
                if (btnId) {
                    document.getElementById(btnId).classList.add("active");
                }
            }
        }

        async function apiCalculate(operator, operand) {
            const res = await fetch('/api/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `operator=${encodeURIComponent(operator)}&operand=${encodeURIComponent(operand)}`
            });
            return res.json();
        }

        async function handleOperator(operator) {
            if (!currentInput) {
                pendingOperator = operator;
                updateOperatorHighlight();
                return;
            }

            const val = parseFloat(currentInput);
            currentInput = "";
            isNewCalculationStart = true;

            const opToExecute = pendingOperator || "+";
            
            try {
                const res = await apiCalculate(opToExecute, val);
                if (res.status === "error") {
                    showToast(res.message);
                    currentInput = val.toString();
                    refreshDisplay();
                } else {
                    backendValue = res.currentValue;
                    updateUI(res);
                    pendingOperator = operator;
                    updateOperatorHighlight();
                }
            } catch (err) {
                showToast("連線錯誤或計算失敗");
            }
        }

        async function handleEquals() {
            if (!currentInput) return;
            if (!pendingOperator) {
                return;
            }

            const val = parseFloat(currentInput);
            const op = pendingOperator;

            currentInput = "";
            pendingOperator = null;
            isNewCalculationStart = true;
            updateOperatorHighlight();

            try {
                const res = await apiCalculate(op, val);
                if (res.status === "error") {
                    showToast(res.message);
                    currentInput = val.toString();
                    refreshDisplay();
                } else {
                    backendValue = res.currentValue;
                    updateUI(res);
                }
            } catch (err) {
                showToast("連線錯誤或計算失敗");
            }
        }

        document.getElementById("btn-clear").addEventListener("click", async () => {
            currentInput = "";
            pendingOperator = null;
            isNewCalculationStart = true;
            updateOperatorHighlight();
            try {
                const res = await fetch('/api/clear', { method: 'POST' }).then(r => r.json());
                backendValue = res.currentValue;
                updateUI(res);
            } catch (err) {
                showToast("清除失敗");
            }
        });

        document.getElementById("btn-undo").addEventListener("click", async () => {
            currentInput = "";
            isNewCalculationStart = true;
            try {
                const res = await fetch('/api/undo', { method: 'POST' }).then(r => r.json());
                backendValue = res.currentValue;
                updateUI(res);
            } catch (err) {
                showToast("復原失敗");
            }
        });

        document.getElementById("btn-redo").addEventListener("click", async () => {
            currentInput = "";
            isNewCalculationStart = true;
            try {
                const res = await fetch('/api/redo', { method: 'POST' }).then(r => r.json());
                backendValue = res.currentValue;
                updateUI(res);
            } catch (err) {
                showToast("取消復原失敗");
            }
        });

        document.getElementById("btn-backspace").addEventListener("click", () => {
            if (currentInput) {
                currentInput = currentInput.slice(0, -1);
                if (currentInput === "" || currentInput === "-") {
                    currentInput = "";
                }
                refreshDisplay();
            }
        });

        function updateUI(res) {
            document.getElementById("value-display").innerText = res.currentValue;
            
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";
            res.history.forEach(item => {
                const li = document.createElement("li");
                li.className = "history-item";
                li.innerText = item;
                historyList.appendChild(li);
            });
            historyList.scrollTop = historyList.scrollHeight;

            const expressionDisplay = document.getElementById("expression-display");
            if (res.history.length > 0) {
                expressionDisplay.innerText = res.history[res.history.length - 1];
            } else {
                expressionDisplay.innerText = "";
            }

            document.getElementById("btn-undo").disabled = !res.undoAvailable;
            document.getElementById("btn-redo").disabled = !res.redoAvailable;
            
            // Sync pending operator from backend response
            pendingOperator = res.pendingOperator;
            updateOperatorHighlight();
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key;
            if (/[0-9]/.test(key)) {
                appendDigit(key);
            } else if (key === ".") {
                appendDigit(".");
            } else if (key === "+" || key === "-" || key === "*" || key === "/") {
                handleOperator(key);
            } else if (key === "Enter" || key === "=") {
                e.preventDefault();
                handleEquals();
            } else if (key === "Escape") {
                document.getElementById("btn-clear").click();
            } else if (key === "Backspace") {
                document.getElementById("btn-backspace").click();
            } else if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === "z") {
                e.preventDefault();
                document.getElementById("btn-undo").click();
            } else if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === "y") {
                e.preventDefault();
                document.getElementById("btn-redo").click();
            }
        });
    </script>
</body>
</html>
